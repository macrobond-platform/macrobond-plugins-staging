name: Create release

# Runs when a release PR is merged into main. Reads the version the platform
# pipeline stamped into the plugin manifests, tags the merge vX.Y.Z, and attaches
# two ZIPs to the GitHub release: the plugin packages, and the Microsoft 365 app
# package zipped from packages/m365/appPackage/ so that its manifest.json sits at
# the ZIP root (Microsoft rejects a nested package). The M365 ZIP is attached both
# versioned and under a fixed name, so /releases/latest/download/ always resolves.
# Skips if the tag already exists.

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

env:
  # Hyphens, not spaces: GitHub rewrites every space in an asset filename to a dot.
  # The spaced-out name is the asset's display label instead.
  M365_ZIP: Macrobond-AI-Data-Feed-M365-Copilot-Agent
  M365_LABEL: Macrobond AI Data Feed - M365 Copilot Agent

jobs:
  release:
    name: Create GitHub release and ZIP
    runs-on: ubuntu-24.04
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version from plugin manifest
        id: version
        run: |
          set -euo pipefail
          version=$(jq -r '.version' packages/claude/.claude-plugin/plugin.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not parse semver from plugin.json: '$version'"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v${version}"
            echo "zip=macrobond-plugin-${version}.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create ZIP
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          zip -r "${{ steps.version.outputs.zip }}" \
            .agents/ \
            .claude-plugin/ \
            .cursor-plugin/ \
            .github/plugin/ \
            packages/ \
            CHANGELOG.md \
            LICENCE \
            README.md
          echo "Created ${{ steps.version.outputs.zip }} ✓"

      - name: Create M365 app package ZIP
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f packages/m365/appPackage/manifest.json ]; then
            echo "::error::packages/m365/appPackage/ is missing or incomplete."
            exit 1
          fi
          # Every artefact in a release carries the same version, or a customer
          # downloads "V1.2.3" and Teams shows them something else.
          app_version=$(jq -r '.version' packages/m365/appPackage/manifest.json | tr -d '\r')
          if [ "$app_version" != "$VERSION" ]; then
            echo "::error::version mismatch — the release is $VERSION but the app" \
                 "package manifest says $app_version."
            exit 1
          fi
          ( cd packages/m365/appPackage && zip -qr "$GITHUB_WORKSPACE/${M365_ZIP}-V${VERSION}.zip" . )
          cp "${M365_ZIP}-V${VERSION}.zip" "${M365_ZIP}.zip"
          echo "Created ${M365_ZIP}-V${VERSION}.zip ✓"

      - name: Create GitHub release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # file#label — the label is what the release page shows for each asset.
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.version.outputs.zip }}" \
            "${M365_ZIP}-V${VERSION}.zip#${M365_LABEL} V${VERSION}" \
            "${M365_ZIP}.zip#${M365_LABEL} (latest)" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "**AI code assistants** — see [README](https://github.com/${REPOSITORY}#readme).

          **Microsoft 365 Copilot** — download \`${M365_ZIP}-V${VERSION}.zip\` and upload it as a custom app. See [packages/m365/README.md](https://github.com/${REPOSITORY}/blob/main/packages/m365/README.md)."
          echo "Release ${{ steps.version.outputs.tag }} created ✓"
